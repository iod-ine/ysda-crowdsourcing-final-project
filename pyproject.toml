[project]
name = "project"
version = "0.1.0"
description = "Evaluating butterfly detectors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.23.0",
]

[project.scripts]
evaluate = "project.evaluate:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
