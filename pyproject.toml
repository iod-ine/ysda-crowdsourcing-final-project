[project]
name = "project"
version = "0.1.0"
description = "Evaluating butterfly detectors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
]

[project.scripts]
evaluate = "project.evaluate:main"
materialize = "project.materialize:main"
predict = "project.predict:main"
materialize-dataset = "project.materialize_dataset:main"
render-predictions = "project.render_predictions:main"
recover-predictions = "project.recover_predictions:main"
recover-evaluation = "project.recover_evaluation:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.18.1",
    "marimo>=0.25.2",
]

[tool.ruff]
line-length = 120
